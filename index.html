<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monster Feeder</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👾</text></svg>"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d0d12;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #stage {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
      }
      #stage canvas {
        display: block;
      }
      #audio-hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 24px;
        text-align: center;
        color: #9a9ab0;
        pointer-events: none;
        transition: opacity 0.4s ease;
      }
      #audio-hint.hidden {
        opacity: 0;
      }
      #debug {
        position: fixed;
        top: 8px;
        left: 8px;
        color: #5f6;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        pointer-events: none;
        white-space: pre;
      }
      #share-actions {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 16px;
        display: flex;
        justify-content: center;
        gap: 12px;
      }
      #share-actions.hidden {
        display: none;
      }
      #share-actions button {
        background: #26263a;
        color: #ffffff;
        border: 1px solid #3d3d5c;
        border-radius: 8px;
        padding: 8px 18px;
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
      }
      #share-actions button:hover {
        background: #34344e;
      }
      #share-actions button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #mods-panel {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(560px, calc(100vw - 48px));
        max-height: calc(100vh - 96px);
        overflow-y: auto;
        background: #1d1d2c;
        border: 1px solid #3d3d5c;
        border-radius: 12px;
        padding: 20px 24px;
        color: #e8e8f2;
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
      }
      #mods-panel.hidden {
        display: none;
      }
      #mods-panel h2 {
        margin: 0 0 4px;
        font-size: 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      #mods-close {
        cursor: pointer;
        color: #9a9ab0;
        font-size: 22px;
        line-height: 1;
        padding: 2px 6px;
      }
      #mods-close:hover {
        color: #ffffff;
      }
      #mods-drop-hint {
        color: #9a9ab0;
        font-size: 13px;
        margin: 4px 0 12px;
      }
      #mods-list {
        list-style: none;
        margin: 12px 0;
        padding: 0;
      }
      #mods-list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        background: #26263a;
        border-radius: 8px;
        padding: 8px 12px;
        margin-bottom: 6px;
        font-size: 14px;
      }
      #mods-list .mod-meta {
        color: #9a9ab0;
        font-size: 12px;
      }
      #mods-list button {
        background: #3a2530;
        color: #ff9db4;
        border: 1px solid #5c3d4a;
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
      }
      #mods-list button:hover {
        background: #4a2f3d;
      }
      #mod-errors {
        list-style: none;
        margin: 12px 0 0;
        padding: 10px 12px;
        max-height: 180px;
        overflow-y: auto;
        background: #2c1d22;
        border: 1px solid #5c3d4a;
        border-radius: 8px;
        color: #ff9db4;
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
      #mod-errors.hidden {
        display: none;
      }
      #mod-errors li {
        margin: 2px 0;
        white-space: pre-wrap;
      }
      #mod-status {
        margin-top: 10px;
        min-height: 18px;
        font-size: 13px;
        color: #8be28b;
      }
      #autochart-progress {
        margin-top: 12px;
      }
      #autochart-progress.hidden {
        display: none;
      }
      #autochart-progress-track {
        height: 8px;
        background: #26263a;
        border: 1px solid #3d3d5c;
        border-radius: 4px;
        overflow: hidden;
      }
      #autochart-progress-fill {
        height: 100%;
        width: 0;
        background: #7a5cff;
        border-radius: 4px;
        transition: width 0.2s ease;
      }
      #autochart-progress-label {
        margin-top: 6px;
        font-size: 12px;
        color: #9a9ab0;
      }
      body.mod-dragover::after {
        content: 'drop a mod or a song (mp3/ogg) to auto-chart';
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(122, 92, 255, 0.25);
        border: 3px dashed #7a5cff;
        font-size: 24px;
        color: #ffffff;
        pointer-events: none;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="audio-hint">click or press any key to start audio</div>
    <div id="debug"></div>
    <div id="share-actions" class="hidden">
      <button id="btn-save" type="button">save card 📸</button>
      <button id="btn-copy" type="button">copy card 📋</button>
    </div>
    <div id="mods-panel" class="hidden">
      <h2>Mods <span id="mods-close" title="close (M)">×</span></h2>
      <p id="mods-drop-hint">
        Drop a mod folder, .zip, or a song file (mp3/ogg/wav) anywhere in the
        window to install or auto-chart it — or pick a file:
      </p>
      <input id="mod-file-input" type="file" accept=".zip,.mp3,.ogg,.wav,.m4a,.flac" />
      <div id="autochart-progress" class="hidden">
        <div id="autochart-progress-track">
          <div id="autochart-progress-fill"></div>
        </div>
        <div id="autochart-progress-label"></div>
      </div>
      <ul id="mods-list"></ul>
      <ul id="mod-errors" class="hidden"></ul>
      <div id="mod-status"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
